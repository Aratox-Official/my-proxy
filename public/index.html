<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Proxy</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    input { width: 400px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; margin-left: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Web Proxy</h1>
  <div>
    <input id="url" type="text" placeholder="https://example.com" />
    <button onclick="go()">Go</button>
  </div>

  <script src="/scramjet.config.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/scramjet.service.js", { scope: "/" });
    }

    function go() {
      let url = document.getElementById("url").value.trim();
      if (!url.startsWith("http")) url = "https://" + url;
      const encoded = encodeURIComponent(url);
      window.location = `/scramjet/html/${encoded}`;
    }
  </script>
</body>
</html>
